<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8457a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="グッズ計算">
  <title>グッズ計算</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app"></main>

  <nav class="tabbar">
    <a href="#/" data-tab="events"><span class="icon">🛍</span>イベント</a>
    <a href="#/history" data-tab="history"><span class="icon">📊</span>履歴</a>
    <a href="#/settings" data-tab="settings"><span class="icon">⚙️</span>設定</a>
  </nav>

  <dialog id="event-dialog">
    <form id="event-form" method="dialog">
      <h2 id="event-dialog-title">新しいイベント</h2>
      <label>イベント名
        <input name="name" required autocomplete="off" placeholder="例：○○ライブ 物販">
      </label>
      <label>日付
        <input name="date" type="date" required>
      </label>
      <label>予算（円）
        <input name="budget" type="text" inputmode="numeric" required placeholder="例：15000">
      </label>
      <label>メモ
        <input name="memo" autocomplete="off">
      </label>
      <div class="dialog-actions">
        <button type="button" class="danger" id="event-delete" hidden>削除</button>
        <span class="spacer"></span>
        <button type="button" id="event-cancel">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="bulk-dialog">
    <form id="bulk-form" method="dialog">
      <h2>まとめて入力</h2>
      <p class="note">
        グッズ一覧のテキストを貼り付けるか、スクショを選ぶと、グッズ名と単価を読み取ります。
        読み取りはこのスマホの中で行い、画像はどこにも送りません。
      </p>
      <label class="file-button">
        📷 画像から読み取る
        <input type="file" id="bulk-image" accept="image/*" hidden>
      </label>
      <p class="note" id="bulk-status" hidden></p>
      <textarea id="bulk-text" rows="6" placeholder="例：&#10;アクリルスタンド 1,500円&#10;缶バッジ（ランダム） ¥500&#10;Tシャツ&#10;4,000円"></textarea>
      <div id="bulk-preview"></div>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button type="button" id="bulk-cancel">キャンセル</button>
        <button type="submit" class="primary" id="bulk-add" disabled>追加</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
